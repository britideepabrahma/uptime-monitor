<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Uptime Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:2rem auto;max-width:900px;padding:0 1rem}
    .card{background:#1e293b;border-radius:12px;padding:1rem;margin-bottom:1rem}
    .head{display:flex;justify-content:space-between;align-items:center}
    .badge{padding:2px 10px;border-radius:6px;font-size:.85rem}
    .up{background:#14532d;color:#4ade80}.down{background:#7f1d1d;color:#fca5a5}
    .bars{display:flex;gap:2px;margin:.75rem 0 .25rem}
    .bar{flex:1;height:28px;border-radius:2px}
    .muted{color:#94a3b8;font-size:.85rem}
    a{color:inherit}
  </style>
</head>
<body>
  <h1>Uptime Monitor</h1>
  <p class="muted" id="summary">Loading…</p>
  <div class="card"><canvas id="chart" height="110"></canvas></div>
  <div id="sites"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
async function load() {
  const data = await (await fetch("data/history.json", {cache: "no-store"})).json();
  const allUp = data.sites.every(s => s.checks.at(-1).up);
  summary.textContent = (allUp ? "All systems operational" : "Some systems are down")
    + " · last check " + data.updated;

  sites.innerHTML = data.sites.map(s => {
    const last = s.checks.at(-1);
    const uptime = (100 * s.checks.filter(c => c.up).length / s.checks.length).toFixed(2);
    const times = s.checks.filter(c => c.ms !== null).map(c => c.ms);
    const avg = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : "-";
    const bars = s.checks.slice(-120).map(c =>
      `<div class="bar" title="${c.t} · ${c.up ? c.ms + ' ms' : 'down'}"
            style="background:${c.up ? '#22c55e' : '#ef4444'}"></div>`).join("");
    return `<div class="card">
      <div class="head"><a href="${s.url}">${s.name}</a>
        <span class="badge ${last.up ? 'up' : 'down'}">${last.up ? 'Operational' : 'Down'}</span></div>
      <div class="bars">${bars}</div>
      <div class="muted">${uptime}% uptime (30 days) · avg ${avg} ms</div></div>`;
  }).join("");

  const labels = data.sites[0].checks.slice(-48).map(c => c.t.slice(5, 16));
  new Chart(chart, {
    type: "line",
    data: {labels, datasets: data.sites.map(s => ({
      label: s.name, data: s.checks.slice(-120).map(c => c.ms), pointRadius: 0, tension: 0.3}))},
    options: {
      plugins: {title: {display: true, text: "Response time (ms)", color: "#e2e8f0"},
                legend: {labels: {color: "#e2e8f0"}}},
      scales: {x: {ticks: {color: "#94a3b8", maxTicksLimit: 8}}, y: {ticks: {color: "#94a3b8"}}}
    }
  });
}
load();
</script>
</body>
</html>
